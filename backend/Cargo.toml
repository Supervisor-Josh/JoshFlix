[package]
name = "joshflix"
version = "0.1.0"
description = "A Netflix-style local media center and file manager"
authors = ["Josh"]
edition = "2021"

[lib]
name = "joshflix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "joshflix"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
trash = "3.1"
